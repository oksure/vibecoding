<style>
  .vc-language { position: fixed; right: 1rem; bottom: 1rem; z-index: 1040; font: 14px/1.5 system-ui, sans-serif; }
  .vc-language-switch { display: flex; gap: 3px; padding: 4px; margin-left: auto; width: max-content; background: var(--bs-body-bg, white); border: 1px solid var(--bs-border-color, #d9dfe5); border-radius: 999px; box-shadow: 0 3px 14px #00000012; }
  .vc-language button { border: 0; border-radius: 999px; padding: 6px 13px; color: var(--bs-body-color, #333); background: transparent; font: inherit; cursor: pointer; }
  .vc-language button[aria-pressed="true"] { color: white; background: #2373ae; }
  .vc-language button:focus-visible { outline: 3px solid #80b9e6; outline-offset: 2px; }
  .vc-language button:disabled { opacity: .5; cursor: not-allowed; }
  .vc-language-note { max-width: min(340px, calc(100vw - 2rem)); padding: 12px 15px; margin-bottom: 8px; border: 1px solid var(--bs-border-color, #d9dfe5); border-radius: 10px; color: var(--bs-body-color, #333); background: var(--bs-body-bg, white); box-shadow: 0 3px 14px #00000012; }
  .vc-language-note:empty { display: none; }
  @media print { .vc-language { display: none !important; } }
</style>
<script>
(() => {
  "use strict";
  function init() {
    if (!document.documentElement.lang.startsWith("ko")) return;
    document.body.normalize();
    const originalLang = document.documentElement.lang;
    const ui = document.createElement("aside");
    ui.className = "vc-language notranslate";
    ui.setAttribute("translate", "no");
    ui.setAttribute("aria-label", "읽기 언어 / Reading language");
    ui.innerHTML = '<div class="vc-language-note" role="status" aria-live="polite"></div><div class="vc-language-switch" role="group" aria-label="언어 선택"><button type="button" lang="ko" aria-pressed="true" title="한국어 원문 보기">KO</button><button type="button" lang="en" aria-pressed="false" title="Read the prepared English translation">EN</button></div>';
    document.body.append(ui);
    const [ko, en] = ui.querySelectorAll("button");
    const note = ui.querySelector('[role="status"]');
    let data;
    try {
      data = JSON.parse(document.getElementById("vc-translation-data").textContent);
      if (data.version !== 1 || typeof data.excluded !== "string" || !data.translations) throw new Error("invalid payload");
    } catch (_) {
      en.disabled = true;
      note.textContent = "이 미리보기에는 영어 번역이 준비되지 않았습니다.";
      return;
    }
    const originals = [];
    const walker = document.createTreeWalker(document.body, 4);
    let node;
    while ((node = walker.nextNode())) {
      if (!/[\uac00-\ud7a3\u3131-\u318e]/.test(node.data) || !node.parentElement || node.parentElement.closest(data.excluded)) continue;
      const source = node.data.trim();
      const translated = Object.hasOwn(data.translations, source) ? data.translations[source] : null;
      if (typeof translated !== "string" || !translated.trim()) {
        en.disabled = true;
        note.textContent = "이 글의 영어 번역을 준비 중입니다. 한국어 원문을 먼저 읽어 주세요.";
        return;
      }
      originals.push({node, original: node.data, english: node.data.match(/^\s*/)[0] + translated + node.data.match(/\s*$/)[0]});
    }
    function select(lang, remember = true) {
      for (const item of originals) if (item.node.isConnected) item.node.data = lang === "en" ? item.english : item.original;
      document.documentElement.lang = lang === "en" ? "en" : originalLang;
      ko.setAttribute("aria-pressed", String(lang === "ko"));
      en.setAttribute("aria-pressed", String(lang === "en"));
      note.textContent = lang !== "en" ? "" : location.pathname.includes("/reviews/")
        ? "Machine translation · Leave feedback on the KO original."
        : "Machine translation · Select KO to read the original.";
      if (remember) {
        try { localStorage.setItem("vc-reading-language", lang); } catch (_) {}
        try { sessionStorage.removeItem("vc-reading-language"); } catch (_) {}
      }
    }
    ko.addEventListener("click", () => select("ko"));
    en.addEventListener("click", () => select("en"));
    try {
      if ((localStorage.getItem("vc-reading-language") || sessionStorage.getItem("vc-reading-language")) === "en") select("en", false);
    } catch (_) {}
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, {once: true});
  else init();
})();
</script>
