<style>
  .vc-language { position: fixed; right: 1rem; bottom: 1rem; z-index: 1040; font: 14px/1.5 system-ui, sans-serif; }
  .vc-language-switch { display: flex; gap: 3px; padding: 4px; margin-left: auto; width: max-content; background: var(--bs-body-bg, white); border: 1px solid var(--bs-border-color, #d9dfe5); border-radius: 999px; box-shadow: 0 3px 14px #00000012; }
  .vc-language button { border: 0; border-radius: 999px; padding: 6px 13px; color: var(--bs-body-color, #333); background: transparent; font: inherit; cursor: pointer; }
  .vc-language button[aria-pressed="true"] { color: white; background: #2373ae; }
  .vc-language button:focus-visible { outline: 3px solid #80b9e6; outline-offset: 2px; }
  .vc-language button:disabled { opacity: .65; cursor: progress; }
  .vc-language-note { max-width: min(340px, calc(100vw - 2rem)); padding: 12px 15px; margin-bottom: 8px; border: 1px solid var(--bs-border-color, #d9dfe5); border-radius: 10px; color: var(--bs-body-color, #333); background: var(--bs-body-bg, white); box-shadow: 0 3px 14px #00000012; }
  .vc-language-note:empty { display: none; }
  .vc-language-note a { display: block; margin-top: 5px; }
  @media print { .vc-language { display: none !important; } }
</style>
<script>
(() => {
  "use strict";
  // This is a reading aid on Korean pages. The separately published English
  // edition remains available at its existing URLs.
  if (!document.documentElement.lang.startsWith("ko")) return;

  const hangul = /[\uac00-\ud7a3\u3131-\u318e]/;
  const excluded = 'script,style,noscript,pre,code,kbd,samp,svg,math,mjx-container,textarea,input,select,iframe,.notranslate,[translate="no"],.vc-language,#quarto-search-results,.quarto-search-panel,hypothesis-sidebar,hypothesis-adder,hypothesis-notebook';
  const ui = document.createElement("aside");
  ui.className = "vc-language notranslate";
  ui.setAttribute("translate", "no");
  ui.setAttribute("aria-label", "읽기 언어 / Reading language");
  ui.innerHTML = '<div class="vc-language-note" role="status" aria-live="polite"></div><div class="vc-language-switch" role="group" aria-label="언어 선택"><button type="button" lang="ko" aria-pressed="true" title="한국어 원문 보기">KO</button><button type="button" lang="en" aria-pressed="false" title="Translate this page into English">EN</button></div>';
  document.body.append(ui);
  const [ko, en] = ui.querySelectorAll("button");
  const note = ui.querySelector('[role="status"]');
  const originalLang = document.documentElement.lang;
  const originalTitle = document.title;
  const originals = [];
  let cache = new Map();
  try { cache = new Map(JSON.parse(sessionStorage.getItem("vc-translation-ko-en-v1") || "[]")); } catch (_) { /* Storage may be unavailable. */ }
  let generation = 0;
  let worker;
  let nativeTranslator;
  let requestId = 0;
  const pending = new Map();

  function show(text) { note.textContent = text; }
  function collect() {
    if (originals.length) return;
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        return hangul.test(node.data) && node.parentElement && !node.parentElement.closest(excluded)
          ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    let node;
    while ((node = walker.nextNode())) originals.push({node, text: node.data});
    originals.sort((a, b) => Number(Boolean(b.node.parentElement.closest("main"))) - Number(Boolean(a.node.parentElement.closest("main"))));
  }

  // Keep every character, including very long sentences, while staying below
  // the small fallback model's input limit. Inline elements remain untouched.
  function chunks(text) {
    const result = [];
    const sentences = typeof Intl.Segmenter === "function"
      ? [...new Intl.Segmenter("ko", {granularity: "sentence"}).segment(text)].map(x => x.segment)
      : [text];
    for (const sentence of sentences) {
      const chars = Array.from(sentence);
      for (let i = 0; i < chars.length; i += 180) result.push(chars.slice(i, i + 180).join(""));
    }
    return result;
  }

  // The fallback runs in a worker on the reader's device. Only public model
  // files are downloaded: article text is never sent to an inference server.
  function workerMain() {
    let model;
    async function getModel() {
      if (!model) {
        model = (async () => {
          const {pipeline, env} = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
          env.allowLocalModels = false;
          env.backends.onnx.wasm.numThreads = 1;
          env.backends.onnx.wasm.proxy = false;
          return pipeline("translation", "Xenova/opus-mt-ko-en", {
            revision: "d9fa1ac6008242100fecb4fff9b0a5917a1be81f",
            device: "wasm", dtype: "q8",
            progress_callback: p => {
              if (p.status === "progress") self.postMessage({type: "progress", file: p.file, loaded: p.loaded, total: p.total});
            }
          });
        })();
      }
      return model;
    }
    self.onmessage = async ({data}) => {
      try {
        const translate = await getModel();
        const output = data.type === "init" ? null : (await translate(data.text, {max_new_tokens: 512, num_beams: 1, do_sample: false}))[0].translation_text;
        self.postMessage({id: data.id, output});
      } catch (error) {
        model = null;
        self.postMessage({id: data.id, error: String(error.message || error)});
      }
    };
  }

  function stopWorker() {
    if (worker) { worker.terminate(); worker = null; }
    for (const task of pending.values()) { clearTimeout(task.timer); task.reject(new Error("cancelled")); }
    pending.clear();
  }
  function send(type, text, timeout) {
    return new Promise((resolve, reject) => {
      const id = ++requestId;
      const timer = setTimeout(() => { pending.delete(id); reject(new Error("translation timed out")); }, timeout);
      pending.set(id, {resolve, reject, timer});
      worker.postMessage({id, type, text});
    });
  }
  async function fallback(run) {
    show("번역을 준비하고 있습니다. 처음에는 100 MB 이상의 번역 자료를 내려받아 시간이 걸릴 수 있습니다. KO를 누르면 취소됩니다.");
    const url = URL.createObjectURL(new Blob([`(${workerMain.toString()})();`], {type: "text/javascript"}));
    worker = new Worker(url, {type: "module"});
    URL.revokeObjectURL(url);
    const files = new Map();
    worker.onmessage = ({data}) => {
      if (data.type === "progress") {
        if (generation !== run) return;
        files.set(data.file, data.loaded || 0);
        const mb = Math.round([...files.values()].reduce((a, b) => a + b, 0) / 1e6);
        show(`번역 자료를 준비하고 있습니다 · ${mb} MB 받음. KO를 누르면 취소됩니다.`);
        return;
      }
      const task = pending.get(data.id);
      if (!task) return;
      clearTimeout(task.timer); pending.delete(data.id);
      if (data.error) task.reject(new Error(data.error)); else task.resolve(data.output);
    };
    worker.onerror = () => stopWorker();
    await send("init", "", 240000);
    return text => send("translate", text, 60000);
  }
  async function getTranslator(run) {
    if (nativeTranslator) return text => nativeTranslator.translate(text);
    if ("Translator" in self) {
      try {
        const options = {sourceLanguage: "ko", targetLanguage: "en"};
        if (await Translator.availability(options) !== "unavailable") {
          show("브라우저 번역을 준비하고 있습니다.");
          nativeTranslator = await Translator.create({...options, monitor(m) {
            m.addEventListener("downloadprogress", e => {
              if (generation === run) show(`브라우저 번역 준비 중 · ${Math.round(e.loaded * 100)}%. KO로 취소할 수 있습니다.`);
            });
          }});
          return text => nativeTranslator.translate(text);
        }
      } catch (_) { /* Use the portable on-device translator below. */ }
    }
    return fallback(run);
  }

  function restore(message = "") {
    generation++;
    stopWorker();
    for (const {node, text} of originals) if (node.isConnected) node.data = text;
    document.documentElement.lang = originalLang;
    document.title = originalTitle;
    ko.setAttribute("aria-pressed", "true"); en.setAttribute("aria-pressed", "false");
    en.disabled = false;
    show(message);
    try { sessionStorage.removeItem("vc-reading-language"); } catch (_) {}
  }
  ko.addEventListener("click", () => restore());
  en.addEventListener("click", async () => {
    const run = ++generation;
    en.disabled = true;
    collect();
    const current = () => run === generation;
    try {
      const allCached = originals.every(({text}) => cache.has(text));
      const translate = allCached ? null : await getTranslator(run);
      if (!current()) return;
      let done = 0;
      for (const {node, text} of originals) {
        if (!current()) return;
        let translated = cache.get(text);
        if (translated === undefined) {
          const output = [];
          for (const chunk of chunks(text)) {
            if (!current()) return;
            if (!hangul.test(chunk)) { output.push(chunk); continue; }
            const leading = chunk.match(/^\s*/)[0], trailing = chunk.match(/\s*$/)[0];
            const value = await translate(chunk.trim());
            if (!current()) return;
            if (typeof value !== "string" || !value.trim()) throw new Error("empty translation");
            output.push(leading + value.trim() + trailing);
          }
          translated = output.join(" ");
          cache.set(text, translated);
        }
        if (node.isConnected) node.data = translated;
        done++;
        if (done % 5 === 0) {
          show(`영어로 번역 중 · ${done}/${originals.length}. KO로 돌아갈 수 있습니다.`);
          await new Promise(requestAnimationFrame);
        }
      }
      if (!current()) return;
      document.documentElement.lang = "en";
      try {
        sessionStorage.setItem("vc-reading-language", "en");
        sessionStorage.setItem("vc-translation-ko-en-v1", JSON.stringify([...cache].slice(-2500)));
      } catch (_) {}
      ko.setAttribute("aria-pressed", "false"); en.setAttribute("aria-pressed", "true");
      show(location.pathname.includes("/reviews/")
        ? "Machine translation · Leave feedback on the KO original."
        : "Machine translation · Select KO to read the original.");
    } catch (error) {
      if (!current()) return;
      restore("이 환경에서는 번역을 완료하지 못해 한국어 원문으로 돌아왔습니다. 기기·네트워크 상태를 확인하고 EN을 다시 눌러 주세요.");
      console.warn("Page translation unavailable:", error);
    } finally {
      if (current()) en.disabled = false;
    }
  });
  window.addEventListener("pagehide", () => { generation++; stopWorker(); if (nativeTranslator) nativeTranslator.destroy(); });
  try { if (sessionStorage.getItem("vc-reading-language") === "en") en.click(); } catch (_) {}
})();
</script>
