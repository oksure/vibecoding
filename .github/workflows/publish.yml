name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install translation build tools
        run: npm ci --no-audit --no-fund

      - name: Test saved translations and language switching
        run: npm test

      - name: Install Korean fonts and PyYAML
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk rsync
          python3 -m pip install --quiet pyyaml

      - name: Test PDF image paths
        run: python3 -m unittest discover -s tools -p 'test_pdf_assemble.py'

      - name: Validate manuscript image files
        run: |
          python3 tools/_pdf_assemble.py ko
          python3 tools/_pdf_assemble.py en

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      - name: Install dedicated browser for PDF diagrams
        timeout-minutes: 5
        run: |
          npx --yes @puppeteer/browsers@3.2.7 install chrome-headless-shell@stable --path "$RUNNER_TEMP/quarto-browser"
          quarto_chrome=$(find "$RUNNER_TEMP/quarto-browser" -type f -name chrome-headless-shell -print -quit)
          test -n "$quarto_chrome"
          "$quarto_chrome" --version
          echo "QUARTO_CHROMIUM=$quarto_chrome" >> "$GITHUB_ENV"

      - name: Verify PDF diagram rendering
        timeout-minutes: 2
        run: quarto render tools/fixtures/mermaid-typst.qmd --to typst --output-dir "$RUNNER_TEMP/diagram-check"

      - name: Build reading and review HTML (ko+en)
        timeout-minutes: 10
        run: tools/build html

      - name: Build Korean PDF
        timeout-minutes: 5
        run: tools/build pdf ko

      - name: Build English PDF
        timeout-minutes: 5
        run: tools/build pdf en

      - name: Assemble website
        run: tools/build site

      - uses: actions/upload-artifact@v7
        with:
          name: rendered-book
          path: _site/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  translations:
    name: English translation readiness
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          name: rendered-book
          path: _site/

      - name: Attach available English and report untranslated pages
        run: node tools/pretranslate.mjs --allow-missing --report translation-backlog.json

      - name: Verify English-ready pages and Korean-only fallback pages
        run: node tools/pretranslate.mjs --check --allow-missing

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: translation-backlog
          path: translation-backlog.json
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: translations
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
