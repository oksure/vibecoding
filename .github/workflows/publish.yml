name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Korean fonts and PyYAML
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk rsync
          python3 -m pip install --quiet pyyaml

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      - name: Build book (HTML ko+en, PDF ko+en, assemble _site)
        run: tools/build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
